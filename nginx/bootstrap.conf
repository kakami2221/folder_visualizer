# Temporary HTTP-only configuration used solely while obtaining the first
# Let's Encrypt certificate. Replace example.com before enabling.

log_format folder_visualizer_bootstrap
    '$remote_addr [$time_local] "$request_method $server_protocol" '
    '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    client_max_body_size 1m;
    server_tokens off;

    access_log /var/log/nginx/folder-visualizer_access.log folder_visualizer_bootstrap;
    error_log /var/log/nginx/folder-visualizer_error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /static/ {
        root /srv/folder-visualizer;
        try_files $uri =404;
        # Compatibility URL only; release assets use /assets/<version>/.
        expires -1;
        access_log off;
    }

    location ^~ /assets/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
    }
}
